<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="./css/styles.css">
	<script src="./js/layout.js" defer></script>
	<title>The Bird Log</title>
</head>
<body>
	<header></header>
	<nav></nav>


	<main class="content-container">

        <section class="form-container">

            <form id="form-registro">
                <div class="input-box">
                    <label for="username">Nombre de usuario</label><br>
                    <input type="text" id="username" name="username"  required>
                    <span>hola</span>
                </div>
                
                <div class="input-box">
                    <label for="email">Correo electrónico</label><br>
                    <input type="email" id="email" name="email"  required>
                </div>
                
                <div class="input-box">
                    <label for="phone">Número de teléfono</label><br>
                    <input type="tel" id="phone" name="phone"  required>
                </div>
                
                <div class="input-box">
                    <label for="region">Región</label><br>
                    <select id="region" required>
                        <option value="">Selecciona una región</option>
                    </select>
                </div>
                
                <div class="input-box">
                    <label for="comuna">Comuna</label><br>
                    <select id="comuna" required>
                        <option value="">Selecciona primero la región</option>
                    </select>
                </div>

                <div class="input-box">
                    <label for="password">Contraseña</label><br>
                    <input type="password" id="password" name="password"  required>
                </div>
                
                <button type="submit" class="main-button">Crear cuenta</button>
            </form>

            <script src="./js/register.js"></script>
        </section>
    </main>

    
	<footer></footer>
</body>
