<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="./css/styles.css">
	<script src="./js/layout.js" defer></script>
	<title>The Bird Log</title>
</head>
<body>
    <header></header>

	<main class="content-container">
        
        <h1>Inicia sesión</h1>

        <form id="form-registro">
            
            <div class="input-box">
                <label for="username">Nombre de usuario</label><br>
                <input type="text" id="username" name="username"  required>
            </div>
            
            <div class="input-box">
                <label for="password">Contraseña</label><br>
                <input type="password" id="password" name="password"  required>
            </div>
            <span class="error" id="wrong">Usuario o contraseña incorrectos</span>

            <button type="submit" class="main-button">Iniciar sesión</button>
            <button onclick="window.location.href='./register.html'" class="sec-button">Crear nueva cuenta</button>
            
        </form>
        <script src="./js/login.js"></script>

	</main>

	<footer></footer>



</body>
